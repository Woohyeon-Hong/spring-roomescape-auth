<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>회원가입 - Roomescape</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet" />
</head>
<body>
<main class="page">
  <header class="hero">
    <p class="eyebrow">ROOMESCAPE</p>
    <h1>회원가입</h1>
    <p>이름, 이메일, 비밀번호를 입력해 계정을 생성하세요.</p>
    <p><a class="admin-link" href="/index.html">사용자 예약 페이지로 돌아가기</a></p>
  </header>

  <section class="panel">
    <h2>회원 정보 입력</h2>
    <form class="grid-form" id="signupForm">
      <input id="name" maxlength="20" name="name" placeholder="회원 이름" required />
      <input id="email" name="email" placeholder="이메일" required type="email" />
      <input id="rawPassword" name="rawPassword" placeholder="비밀번호" required type="password" />
      <button type="submit">회원가입</button>
    </form>
  </section>

  <p class="message" id="message"></p>
</main>
<script src="/signup.js"></script>
</body>
</html>
