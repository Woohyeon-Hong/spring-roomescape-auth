<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>로그인 - Roomescape</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet" />
</head>
<body>
<main class="page">
  <header class="hero">
    <p class="eyebrow">ROOMESCAPE</p>
    <h1>로그인</h1>
    <p>이메일과 비밀번호로 로그인하세요.</p>
    <p><a class="admin-link" href="/index.html">사용자 예약 페이지로 돌아가기</a></p>
  </header>

  <section class="panel">
    <h2>로그인</h2>
    <form class="grid-form" id="loginForm">
      <input id="email" name="email" placeholder="이메일" required type="email" />
      <input id="password" name="password" placeholder="비밀번호" required type="password" />
      <button type="submit">로그인</button>
    </form>
    <div class="chips">
      <button class="ghost" id="logoutButton" type="button">로그아웃</button>
      <button class="danger" id="deleteMemberButton" type="button">회원 탈퇴</button>
    </div>
    <p id="authStatus">로그인이 필요합니다.</p>
  </section>

  <p class="message" id="message"></p>
</main>
<script src="/login.js?v=20260521-1"></script>
</body>
</html>
